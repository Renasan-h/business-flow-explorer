name: Validate application
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # package-lock.jsonが未登録のためnpm ciではなくnpm installを使用する。
      - run: npm install --no-audit --no-fund
      - run: npm run build
